name: Celeste CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celeste-core
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: celeste-core/pyproject.toml

      - name: Install Core
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  android-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: celeste-android
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
