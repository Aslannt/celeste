[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "celeste-core"
version = "0.4.2"
description = "Local core service for the Celeste personal assistant"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "PyYAML>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "openai>=2.38,<3.0",
    "google-api-python-client>=2.0,<3.0",
    "google-auth-httplib2>=0.2,<1.0",
    "google-auth-oauthlib>=1.0,<2.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "psutil>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1.0",
]
# Voz local para Android (ADR-014): Whisper + Piper en este PC.
voice = [
    "numpy>=1.26",
    "faster-whisper>=1.1",
    "piper-tts>=1.3",
    "nvidia-cublas-cu12; platform_system == 'Windows'",
    "nvidia-cudnn-cu12; platform_system == 'Windows'",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "logs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
